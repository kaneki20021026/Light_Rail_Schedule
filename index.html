<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#174e42">
<meta name="description" content="兆麟站往屯門站：505、507 輕鐵即時到站時間。">
<title>兆麟 → 屯門 · 下一班輕鐵</title>
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="下一班輕鐵">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{color-scheme:light;--ink:#203c34;--green:#174e42;--muted:#6b786e;--paper:#f5f5ec;--line:#dce2d7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}main{max-width:480px;margin:auto;padding:max(22px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom))}.icon{width:22px;height:22px;flex-shrink:0}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700}.mark{width:32px;height:32px;display:grid;place-items:center;background:var(--green);border-radius:10px;color:#edf2d8}.brand-name{letter-spacing:.04em}#clock{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:22px}h1{font-size:32px;letter-spacing:-.055em;margin:0;font-weight:750;white-space:nowrap}h1 span{color:#97a98e;font-weight:400;margin:0 10px}.platform{display:flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap;color:var(--green);background:#e4eadb;border-radius:9px;padding:8px}.platform .icon{width:20px;height:20px}.hero{background:var(--green);color:#f6f7e9;border-radius:26px;padding:23px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:170px;height:170px;border:1px solid #ffffff12;border-radius:50%;right:-94px;top:48px;box-shadow:0 0 0 28px #ffffff04,0 0 0 56px #ffffff03;pointer-events:none}.hero-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#d0dfd4}.live{display:flex;align-items:center;gap:6px;font-size:11px}.dot{width:6px;height:6px;background:#d3e8a6;border-radius:50%}.hero-time{margin:24px 0;display:flex;align-items:baseline;gap:10px;min-height:80px}.hero-time strong{font-size:88px;line-height:1;letter-spacing:-.065em;font-variant-numeric:tabular-nums}.hero-time strong.words{font-size:32px;letter-spacing:-.03em;line-height:1.5}.hero-time span{color:#dae5d9;font-size:15px}.hero-bottom{display:flex;align-items:center;gap:10px;font-size:14px;min-height:34px;flex-wrap:wrap}.hero-bottom .cars{margin-left:auto;color:#dcedb3}.badge{display:inline-flex;align-items:center;justify-content:center;min-width:51px;padding:6px 9px;border-radius:8px;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;background:#e5efc7;color:#234a38}.badge.r507{background:#efdfc2;color:#664a20}.section-head{display:flex;align-items:center;justify-content:space-between;margin:25px 0 2px}h2{font-size:14px;margin:0}#count{font-size:11px;color:var(--muted)}.train{display:flex;align-items:center;gap:12px;padding:17px 0;border-bottom:1px solid var(--line)}.train-info{flex:1;min-width:0}.train-info strong{display:block;font-size:14px;font-weight:600}.train-info .cars{margin-top:7px}.cars{display:inline-flex;align-items:center;gap:3px;color:#72846d}.car{width:25px;height:16px}.car+.car{margin-left:-2px}.cars-unknown{font-size:11px}.eta{font-weight:750;font-size:27px;white-space:nowrap;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.eta small{font-size:12px;font-weight:400;margin-left:5px;letter-spacing:0}.eta.words{font-size:14px}.empty{font-size:13px;color:var(--muted);line-height:1.8;padding:20px 0}#notice{background:#fff0d9;color:#79551f;border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;margin-top:14px}#notice[hidden]{display:none}.refresh-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:17px}.refresh-info{font-size:11px;color:var(--muted);line-height:1.9}.actions{display:flex;gap:6px}button{font:inherit;color:var(--green);background:transparent;border:1px solid var(--line);border-radius:50%;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}button:disabled{opacity:.5;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid #ae811f;outline-offset:4px}.information{padding:15px 0 0;font-size:12px;color:var(--muted);line-height:1.8}.information[hidden]{display:none}.information p{margin:0 0 10px}.information a{color:var(--green);text-underline-offset:3px}.legend{display:flex;gap:20px;margin-bottom:12px}.legend span{display:flex;align-items:center;gap:7px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(min-width:650px){body{padding-top:30px}main{border:1px solid var(--line);border-radius:32px;padding:28px;margin-bottom:30px}}@media(max-width:350px){main{padding-left:16px;padding-right:16px}h1{font-size:28px}.platform{padding:7px 5px}.heading{gap:5px}.hero{padding:20px}}
</style>
</head>
<body>
<main>
<header><div class="brand"><span class="mark"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="16" rx="4"/><path d="M5 11h14M12 3v8M8 19l-2 3m10-3 2 3M8 15h1m6 0h1"/></svg></span><span class="brand-name">下一班輕鐵</span></div><time id="clock"></time></header>
<div class="heading"><h1>兆麟<span>→</span>屯門</h1><span class="platform" aria-label="1 號月台"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V3h16v18M4 17h16"/><path d="M11 7h2v6"/></svg><span>月台</span></span></div>
<section class="hero" aria-label="最快到站列車">
<div class="hero-top"><span>下一班抵達兆麟</span><span class="live"><span class="dot"></span><span id="liveLabel">連線中</span></span></div>
<div class="hero-time"><strong id="nextTime" class="words">讀取中</strong><span id="nextUnit"></span></div>
<div class="hero-bottom" id="nextRoute">正在取得港鐵到站時間…</div>

</section>
<div id="notice" role="status" hidden></div>
<section aria-label="到站班次"><div class="section-head"><h2>稍後班次</h2><span id="count">505 / 507</span></div><div id="trains"><p class="empty">正在讀取即時班次…</p></div></section>
<div class="refresh-row"><div class="refresh-info"><div id="updated">更新 —</div><div id="refreshStatus">15 秒自動更新</div></div><div class="actions"><button id="refresh" type="button" aria-label="更新班次" title="更新班次"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 11.6-1L20 9M4 15l2.4 3A7 7 0 0 0 18 17"/></svg></button><button id="infoToggle" type="button" aria-label="路線及圖示說明" aria-expanded="false" aria-controls="information" title="路線及圖示說明"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></svg></button></div></div>
<aside class="information" id="information" hidden><div class="legend" id="legend"></div><p>505 往兆康、507 往田景，均經屯門。兆麟 → 安定 → 市中心 → 屯門。</p><p>顯示抵達兆麟的預計時間。以車站顯示及廣播為準。</p><a href="https://data.gov.hk/tc-data/dataset/mtr-lrnt_data-light-rail-nexttrain-data" target="_blank" rel="noopener">港鐵開放數據</a></aside>
<noscript><p>請開啟瀏覽器 JavaScript 以讀取即時到站時間。</p></noscript>
</main>
<script>
'use strict';
const API='https://rt.data.gov.hk/v1/transport/mtr/lrt/getSchedule?station_id=265';
const REFRESH_MS=15000, MAX_AGE=90000;
const $=id=>document.getElementById(id);
let busy=false, nextRefresh=0, sourceTime=0, showing=false;
function text(id,value){$(id).textContent=value;}
function el(tag,cls,value){const e=document.createElement(tag);if(cls)e.className=cls;if(value!==undefined)e.textContent=value;return e;}
function parseTime(value){if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(value))return NaN;return Date.parse(value.replace(' ','T')+'+08:00');}
function eta(r){const s=String(r.time_en||'').trim(),ch=String(r.time_ch||'').trim();if(/arriving|departing/i.test(s)||/即將抵達|正在離開/.test(ch))return {rank:0,label:ch||(/departing/i.test(s)?'正在離開':'即將抵達'),words:true};const m=s.match(/^(\d+)\s*mins?$/i)||ch.match(/^(\d+)\s*分鐘$/);if(m)return {rank:Number(m[1]),label:m[1],words:false};return {rank:Infinity,label:'時間待定',words:true};}
function selectTrains(data){return data.platform_list.filter(p=>String(p.platform_id)==='1').flatMap(p=>Array.isArray(p.route_list)?p.route_list:[]).filter(r=>(r.route_no==='505'&&(r.dest_en==='Siu Hong'||r.dest_ch==='兆康')||r.route_no==='507'&&(r.dest_en==='Tin King'||r.dest_ch==='田景'))&&Number(r.stop||0)===0&&Number(r.special||0)===0).map(r=>({...r,eta:eta(r)})).sort((a,b)=>a.eta.rank-b.eta.rank);}
function carIcon(){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 30 20');svg.setAttribute('class','car');svg.setAttribute('aria-hidden','true');svg.innerHTML='<rect x="2" y="2" width="26" height="13" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 6h3m4 0h3m4 0h2M7 10h3m4 0h3m4 0h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="17" r="2" fill="currentColor"/><circle cx="22" cy="17" r="2" fill="currentColor"/>';return svg;}
function cars(length){const n=Number(length),label=n===1?'單卡列車':n===2?'雙卡列車':'車廂數目未提供';const e=el('span','cars');e.setAttribute('role','img');e.setAttribute('aria-label',label);e.title=label;if(n===1||n===2){for(let i=0;i<n;i++)e.append(carIcon());}else e.append(el('span','cars-unknown','—'));return e;}
function badge(r){return el('span','badge r'+r.route_no,r.route_no);}
function clearDisplay(title,detail){showing=false;text('nextTime',title);$('nextTime').className='words';text('nextUnit','');text('nextRoute',detail);$('trains').replaceChildren(el('p','empty',detail));text('count','505 / 507');}
function render(rows){showing=true;const first=rows[0];if(!first){clearDisplay('暫無班次','暫未有前往屯門站的預報，請稍後再試。');return;}text('nextTime',first.eta.label);$('nextTime').className=first.eta.words?'words':'';text('nextUnit',first.eta.words?'':'分鐘');$('nextRoute').replaceChildren(badge(first),el('span','',`往${first.dest_ch}`),cars(first.train_length));text('count',`${rows.length} 班預報`);const rest=rows.slice(1);$('trains').replaceChildren(...rest.map(r=>{const row=el('div','train');const info=el('div','train-info');info.append(el('strong','',`往${r.dest_ch}`),cars(r.train_length));const time=el('div','eta'+(r.eta.words?' words':''),r.eta.label);if(!r.eta.words)time.append(el('small','','分鐘'));row.append(badge(r),info,time);return row;}));if(!rest.length)$('trains').append(el('p','empty','暫未有更多班次預報。'));}
function warn(message){$('notice').hidden=false;text('notice',message);}
async function refresh(){if(busy||document.hidden)return;busy=true;$('refresh').disabled=true;text('refreshStatus','正在更新…');const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),10000);try{const response=await fetch(API,{signal:controller.signal,cache:'no-store'});if(!response.ok)throw Error('http');const data=await response.json();if(Number(data.status)!==1)throw Error('service');if(!Array.isArray(data.platform_list))throw Error('invalid');const timestamp=parseTime(data.system_time);if(!Number.isFinite(timestamp))throw Error('invalid');sourceTime=timestamp;text('updated','更新 '+data.system_time.slice(11));if(Date.now()-timestamp>MAX_AGE||timestamp-Date.now()>60000)throw Error('stale');render(selectTrains(data));$('notice').hidden=true;text('liveLabel','即時預報');}catch(error){clearDisplay(error.message==='stale'?'資料已過期':'暫未能更新','暫時無法提供可靠的即時班次。');text('liveLabel','等待更新');warn(error.message==='stale'?'港鐵資料時間較舊，已隱藏班次。稍後會自動重試；亦請確認手機時間正確。':error.message==='service'?'港鐵暫時未有提供服務資料，稍後會自動重試。':'無法連接港鐵資料，請檢查網絡。稍後會自動重試，亦可按「更新」。');}finally{clearTimeout(timeout);busy=false;$('refresh').disabled=false;nextRefresh=Date.now()+REFRESH_MS;tick();}}
function tick(){text('clock',new Intl.DateTimeFormat('zh-HK',{timeZone:'Asia/Hong_Kong',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date()));if(showing&&Date.now()-sourceTime>MAX_AGE){clearDisplay('資料已過期','等候最新的到站預報。');text('liveLabel','等待更新');warn('資料已超過 90 秒，已隱藏舊班次。');}if(!busy){const left=Math.max(0,Math.ceil((nextRefresh-Date.now())/1000));text('refreshStatus',`${left} 秒後自動更新`);if(left===0&&!document.hidden)refresh();}}
$('infoToggle').addEventListener('click',()=>{const open=$('information').hidden;$('information').hidden=!open;$('infoToggle').setAttribute('aria-expanded',String(open));});
for(const [n,label] of [[1,'單卡'],[2,'雙卡']]){const item=el('span');item.append(cars(n),el('span','',label));$('legend').append(item);}
$('refresh').addEventListener('click',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();refresh();}});window.addEventListener('online',refresh);window.addEventListener('offline',()=>{clearDisplay('網絡已中斷','恢復連線後會自動重新讀取。');text('liveLabel','離線');warn('目前沒有網絡連線，已隱藏舊班次。');});setInterval(tick,1000);refresh();
</script>
</body>
</html>
